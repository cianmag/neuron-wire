# Grafana dashboard provisioning configuration for neuron-wire.
#
# Place this file in Grafana's provisioning/dashboards/ directory,
# or set GF_PATHS_PROVISIONING to include this path.
#
# The dashboard JSON is loaded from the dashboards/ directory relative to
# this file's location.

apiVersion: 1

providers:
  - name: "Neuron Wire"
    orgId: 1
    folder: "NWP"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
