# Grafana Unified Alerting Rules for Neuron Wire
# Provisioned via /etc/grafana/provisioning/alerting/rules.yml
# Requires Grafana 8+ unified alerting (NG)

apiVersion: 1

groups:
  - orgId: 1
    name: Neuron Wire Infrastructure
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-node-down
        title: Node Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="neuron-wire"} == 0
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Node {{ $labels.instance }} health endpoint unreachable"
          description: >-
            The neuron-wire node at {{ $labels.instance }} has been
            unreachable for more than 60 seconds.
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/NodeDown.md"
        labels:
          severity: critical
          component: infrastructure

  - orgId: 1
    name: Neuron Wire Security
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-high-error-rate
        title: High Auth Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(nwp_auth_failures[5m]) > 10
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High auth failure rate on {{ $labels.instance }}"
          description: >-
            Signature verification failures at {{ $value | printf "%.1f" }}/sec.
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/HighErrorRate.md"
        labels:
          severity: warning
          component: security

      - uid: nwp-rate-limited
        title: Rate Limiting Excessive
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(nwp_rate_limited_packets[5m]) > 50
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Excessive rate limiting on {{ $labels.instance }}"
          description: >-
            Rate-limited packets at {{ $value | printf "%.1f" }}/sec.
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/RateLimitTriggered.md"
        labels:
          severity: warning
          component: security

  - orgId: 1
    name: Neuron Wire Capacity
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-peer-capacity-high
        title: Peer Capacity High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: nwp_peer_capacity_ratio > 0.9
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Peer capacity near exhaustion on {{ $labels.instance }}"
          description: >-
            Peer capacity ratio is {{ $value | printf "%.2f" }} (threshold: 0.9).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/PeerCapacityHigh.md"
        labels:
          severity: warning
          component: capacity

      - uid: nwp-session-capacity-full
        title: Session Capacity Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: nwp_sessions >= nwp_max_peers
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Session capacity at maximum on {{ $labels.instance }}"
          description: >-
            Active sessions have reached the maximum peer limit.
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/SessionCapacityFull.md"
        labels:
          severity: critical
          component: capacity

  - orgId: 1
    name: Neuron Wire DHT
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-dht-nodes-low
        title: DHT Node Count Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: nwp_dht_nodes < 3
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "DHT routing table critically small on {{ $labels.instance }}"
          description: >-
            DHT node count is {{ $value | printf "%.0f" }} (minimum: 3).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/DHTNodeCountLow.md"
        labels:
          severity: warning
          component: dht

  - orgId: 1
    name: Neuron Wire Network
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-high-retransmit
        title: High Retransmit Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(nwp_retransmissions[5m]) > 100
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Excessive retransmissions on {{ $labels.instance }}"
          description: >-
            Retransmission rate at {{ $value | printf "%.1f" }}/sec (threshold: 100/sec).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/HighRetransmitRate.md"
        labels:
          severity: warning
          component: network

  - orgId: 1
    name: Neuron Wire Trust
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-trust-score-low
        title: Trust Score Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (nwp_trust_peers - nwp_trust_rate_limited) / nwp_trust_peers < 0.3
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Average trust score critically low on {{ $labels.instance }}"
          description: >-
            Proportion of healthy peers is {{ $value | printf "%.2f" }} (threshold: 0.3).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/TrustScoreLow.md"
        labels:
          severity: warning
          component: trust

  - orgId: 1
    name: Neuron Wire Performance
    folder: Neuron Wire
    interval: 15s
    rules:
      - uid: nwp-memory-high
        title: Memory High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: process_resident_memory_bytes{job="neuron-wire"} > 400e6
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memory usage exceeds 400 MB on {{ $labels.instance }}"
          description: >-
            Process RSS is {{ $value | humanize1024 }}B (threshold: 400 MB).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/MemoryHigh.md"
        labels:
          severity: warning
          component: performance

      - uid: nwp-tick-rate-low
        title: Tick Rate Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: nwp_tick_rate_hz < 100
              instant: false
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Tick rate below target on {{ $labels.instance }}"
          description: >-
            Engine tick rate is {{ $value | printf "%.0f" }} Hz (threshold: 100 Hz).
          runbook_url: "https://github.com/your-org/neuron-wire/blob/main/runbooks/TickRateLow.md"
        labels:
          severity: warning
          component: performance
