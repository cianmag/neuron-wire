# Neuron Wire reproducible experiment — flat SimulationConfig schema.
# Run: cargo run --release --example simulate -- --config experiments/figure-4-convergence-time-scaling.toml --output-dir results/figure-4-convergence-time-scaling

description = "figure-4-convergence-time-scaling"
node_count = 50
duration_secs = 60
seed = 42
paper_mode = true
bind_prefix = "127.0.0.1"
tick_interval_ms = 1
gossip_interval_ticks = 500
cleanup_interval_ticks = 1000
max_retries = 3
gradient_half_life_ms = 100
maintenance_mode = "fixed"

