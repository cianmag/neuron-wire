# Neuron Wire reproducible experiment — flat SimulationConfig schema.
# Run: cargo run --release --example simulate -- --config experiments/figure-6-node-churn-recovery.toml --output-dir results/figure-6-node-churn-recovery

description = "figure-6-node-churn-recovery"
node_count = 10
duration_secs = 60
seed = 42
paper_mode = true
bind_prefix = "127.0.0.1"
tick_interval_ms = 1
gossip_interval_ticks = 500
cleanup_interval_ticks = 1000
max_retries = 3
gradient_half_life_ms = 100
maintenance_mode = "fixed"

[failure]
mode = "NodeDeath"
trigger_at_sec = 15
percent = 0.3

