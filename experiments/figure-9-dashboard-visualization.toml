# Neuron Wire reproducible experiment — flat SimulationConfig schema.
# Run: cargo run --release --example simulate -- --config experiments/figure-9-dashboard-visualization.toml --output-dir results/figure-9-dashboard-visualization

description = "figure-9-dashboard-visualization"
