[experiment]
name = "figure-8-multi-trial-stats"
description = "Multi-trial statistical analysis (Figure 8)"
paper_mode = true
seed = 42
trials = 10

[simulation]
node_count = 10
duration_secs = 30
stale_ping_secs = 10
tick_interval_us = 1000

[output]
directory = "results/figure-8"
include_raw_logs = false
snapshot_interval_ticks = 100
