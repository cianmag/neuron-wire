# Neuron Wire reproducible experiment — flat SimulationConfig schema.
# Run: cargo run --release --example simulate -- --config experiments/figure-7-failure-injection.toml --output-dir results/figure-7-failure-injection

description = "figure-7-failure-injection"
node_count = 10
duration_secs = 45
seed = 42
paper_mode = true
tick_interval_ms = 1
gossip_interval_ticks = 500
cleanup_interval_ticks = 1000
max_retries = 3
gradient_half_life_ms = 100
maintenance_mode = "fixed"

[failure]
mode = "malicious"
trigger_at_sec = 10
percent = 0.2

