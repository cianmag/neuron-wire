# ─── Production Docker Compose stack for Neuron Wire Protocol ──────
#
# Services:
#   nwp-node     — The NWP node (UDP transport + built-in health HTTP)
#   prometheus    — Scrapes /metrics from each nwp-node
#   grafana       — Dashboards backed by Prometheus
#
# Quick start:
#   cp .env.example .env          # edit defaults
#   docker compose up -d --build
#   docker compose logs -f nwp-node
#
# Scale nodes:
#   docker compose up -d --scale nwp-node=5
# ───────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - nwp-internal
    - nwp-monitoring
  logging: *default-logging
  environment:
    - RUST_LOG=${RUST_LOG:-info}
    - NWP_HEALTH_BIND=0.0.0.0:9100
  deploy:
    resources:
      limits:
        memory: ${NWP_MEMORY_LIMIT:-512M}
        cpus: ${NWP_CPU_LIMIT:-1.0}
      reservations:
        memory: 128M
        cpus: 0.25

services:
  # ── NWP Node ────────────────────────────────────────────────────
  nwp-node:
    <<: *node-base
    container_name: nwp-node
    hostname: nwp-node
    ports:
      - "${NWP_PORT:-9000}:9000/udp"
      - "${NWP_HTTP_PORT:-9100}:9100/tcp"
    volumes:
      - nwp-identity:/etc/nwp/identity
      - nwp-data:/var/lib/nwp
    command:
      - --config
      - /etc/nwp/node-config.toml
      - --identity
      - /etc/nwp/identity/identity.key
    configs:
      - source: node-config
        target: /etc/nwp/node-config.toml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  # ── Prometheus ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nwp-prometheus
    restart: unless-stopped
    networks:
      - nwp-monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5
        reservations:
          memory: 64M
          cpus: 0.1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── Grafana ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: nwp-grafana
    restart: unless-stopped
    networks:
      - nwp-monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-nwp-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5
        reservations:
          memory: 64M
          cpus: 0.1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  nwp-identity:
  nwp-data:
  prometheus-data:
  grafana-data:

networks:
  # Internal node-to-node traffic (UDP transport, peering)
  nwp-internal:
    driver: bridge
  # Monitoring traffic (HTTP health/metrics, Prometheus, Grafana)
  nwp-monitoring:
    driver: bridge

configs:
  node-config:
    content: |
      [node]
      name = "nwp-node"
      bind_addr = "0.0.0.0:9000"
      tick_interval_ms = 1

      [stun]
      enabled = false
      server = "stun.l.google.com:19302"

      [dht]
      enabled = true
      bootstrap_peers = []
      listen_port = 0

      [transport]
      half_life_ms = 100.0
      retransmit_interval_ms = 10

      [security]
      sign_packets = true
      encrypt_payloads = false
