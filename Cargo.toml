[package]
name = "neuron-wire"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "Zero-Copy FlatBuffer Protocol for Planetary Brain"
authors = ["Cian Mac an tSaoir <cian@nousresearch.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cianmag/neuron-wire"
homepage = "https://neuron-wire-dashboard.vercel.app"
documentation = "https://github.com/cianmag/neuron-wire/blob/master/ARCHITECTURE.md"
keywords = ["dht", "kademlia", "p2p", "neural-network", "distributed"]
categories = ["network", "science", "simulation"]

[dependencies]
crc32fast = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.7"
csv = "1"

[lib]
name = "neuron_wire"
crate-type = ["lib"]

[features]
bench = []

[[bench]]
name = "benchmarks"
harness = false
required-features = ["bench"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
