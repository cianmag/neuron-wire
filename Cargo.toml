[package]
name = "neuron-wire"
version = "0.2.0"
edition = "2021"
description = "Zero-Copy FlatBuffer Protocol for Planetary Brain"

[dependencies]
crc32fast = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.7"
csv = "1"

[lib]
name = "neuron_wire"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
