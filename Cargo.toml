[workspace]
members = ["demo"]

[package]
name = "neuron-wire"
version = "0.3.1"
edition = "2021"
rust-version = "1.87"
description = "Infrastructure layer for decentralized AI — P2P peer discovery, gradient exchange, and distributed learning"
authors = ["Zylvon <team@zylvon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cianmag/neuron-wire"
homepage = "https://neuron-wire-dashboard.vercel.app"
documentation = "https://github.com/cianmag/neuron-wire/blob/master/ARCHITECTURE.md"
keywords = ["dht", "kademlia", "p2p", "neural-network", "distributed", "hebbian", "stdp", "decentralized", "federated-learning"]
categories = ["network", "science", "simulation", "wasm"]

[dependencies]
crc32fast = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.7"
csv = "1"

# ── Security / Crypto ─────────────────────────────────
ed25519-dalek = { version = "2", features = ["pem", "rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"
blake2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# ── Platform / Signal Handling ──────────────────────────
[target.'cfg(unix)'.dependencies]
ctrlc = "3"

[lib]
name = "neuron_wire"
crate-type = ["lib"]

[features]
bench = []

[[bench]]
name = "benchmarks"
harness = false
required-features = ["bench"]

[[bench]]
name = "bench_ml"
harness = false
required-features = ["bench"]

[[bench]]
name = "bench_security"
harness = false
required-features = ["bench"]

[[bench]]
name = "protocol_bench"
harness = false
required-features = ["bench"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
