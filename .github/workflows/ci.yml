# ─── CI for neuron-wire ────────────────────────────────────────────
# Primary validation runs on Linux: full build + test suite + clippy.
# macOS receives build checks (compile only). The Windows-hosted runner
# suffers the same toolchain restrictions as our dev environment
# (dlltool.exe cannot create import libraries), so it links against the
# GNU toolchain and runs `cargo check` only — no test execution.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ─── Build & Test (Linux) ─────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --all-targets

      - name: Test
        run: cargo test

      - name: Build node binary
        run: cargo build --release --bin node

      - name: Verify binary
        run: file target/release/node && ls -lh target/release/node

      - name: Compile benchmarks (no run)
        run: cargo bench --features bench --no-run

  # ─── Build & Check (macOS) ────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release --lib

      - name: Check node binary
        run: cargo check --bin node

  # ─── Minimal Check (Windows) ──────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu

      - name: Build lib
        run: cargo build --lib

      - name: Check node binary
        run: cargo check --bin node

  # ─── Docker build smoke test ──────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: neuron-wire-node:ci

      - name: Smoke test — --help exits cleanly
        run: docker run --rm neuron-wire-node --help 2>&1 | head -10
