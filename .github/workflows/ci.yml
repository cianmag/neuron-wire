name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]  # macOS also works; Windows tested locally
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      run: cargo fmt --check
      continue-on-error: true  # format style is a suggestion, not a blocker

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose

    - name: Clippy
      run: cargo clippy -- -D warnings
      continue-on-error: true  # clippy suggestions shouldn't block CI

    - name: Paper-mode benchmark (3 nodes, 10s)
      run: |
        cargo run --example simulate -- --paper-mode --nodes 3 --duration 10 \
          --output-dir results/ci-check

    - name: Validate against known-good
      run: python scripts/validate_repro.py results/ci-check --known-good known-good/

    - name: Paper-mode benchmark (5 nodes, 15s)
      run: |
        cargo run --example simulate -- --paper-mode --nodes 5 --duration 15 \
          --output-dir results/ci-check-5node

    - name: Validate 5-node against known-good
      run: python scripts/validate_repro.py results/ci-check-5node --known-good known-good/

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-${{ matrix.os }}
        path: results/
