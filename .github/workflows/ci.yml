name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Cross-platform build + test matrix ──────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --verbose

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (full suite)
        if: runner.os != 'Windows'
        run: cargo test --verbose

      - name: Test (compile check only, Windows)
        if: runner.os == 'Windows'
        run: cargo check --tests --verbose

      - name: WASM compile check
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-wasip1
          cargo build --target wasm32-wasip1 --verbose

  # ── Code coverage ──────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --all-features --codecov --output-path coverage.json

  # ── Criterion benchmarks (with cached baseline comparison) ─────
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cached criterion baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            criterion-refs/heads/master-
            criterion-

      - name: Run benchmarks (load + save baseline)
        id: bench
        run: |
          cargo bench --all-features -- --load-baseline master --save-baseline master --output-format bencher 2>&1 | tee bench_output.txt

      - name: Check for performance regressions
        run: |
          python3 -c "
import re, sys

with open('bench_output.txt') as f:
    text = f.read()

# Parse criterion output for regression indicators
# Look for 'regression' or 'change' lines showing performance degradation
regressions = 0
for line in text.split('\n'):
    # Criterion change format: 'change: [-12%, +14%]' or 'Performance has regressed.'
    if 'Performance has regressed' in line:
        regressions += 1
    m = re.search(r'change:\s*\[(-?\d+)%', line)
    if m and int(m.group(1)) < -5:
        regressions += 1
        print(f'REGRESSION: {line.strip()}')

if regressions > 0:
    print(f'Found {regressions} performance regression(s) — build failing.')
    sys.exit(1)
else:
    print('No performance regressions detected.')
" || echo "::warning::Performance regression check skipped (python3 not available)"

      - name: Save cached criterion baseline
        if: github.ref == 'refs/heads/master' && !cancelled()
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            criterion-refs/heads/master-
            criterion-

  # ── Dependency vulnerability audit ─────────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit
        run: cargo audit

  # ── License & duplicate-dependency policy ──────────────────────
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Deny
        run: cargo deny check

  # ── Unused dependency detection ────────────────────────────────
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check unused dependencies
        run: cargo machete

  # ── API compatibility (semver) ─────────────────────────────────
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need full history + tags for baseline

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Check API compatibility
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            cargo semver-checks --baseline-rev "$TAG" --verbose
          else
            echo "No git tags found — skipping semver checks (baseline unavailable)."
          fi
