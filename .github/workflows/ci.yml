name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check formatting
        run: cargo fmt --check || echo "cargo fmt not enforced (skip)"

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Code coverage
        run: cargo llvm-cov --all-features --codecov --output-path coverage.json

      - name: Bench (compile-check only)
        run: cargo bench --all-features --no-run || echo "benches may not exist yet"

      - name: Dependency audit
        run: cargo audit || echo "cargo audit warnings (non-blocking)"

      - name: Dependency deny
        run: cargo deny check || echo "cargo deny warnings (non-blocking)"
