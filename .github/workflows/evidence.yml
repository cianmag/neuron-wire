name: Evidence

# Runs the reproducible evidence pipeline on every push to grant-prep.
# Archives results/ so every commit carries a fresh evidence trail.
#
# Jobs:
#   matrix     — deterministic simulations (E1–E9, fixed seeds) + local
#                multi-process clusters (2/5/10/25 real UDP nodes)
#   emulation  — tc netem network impairment on real processes (Linux, sudo)

on:
  push:
    branches: [grant-prep, master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Deterministic simulation matrix (full profile)
        run: bash ./evidence/run_matrix.sh results/evidence full

      - name: Local multi-process clusters (2/5/10/25 nodes)
        run: |
          bash ./evidence/localhost_cluster.sh 2 20
          bash ./evidence/localhost_cluster.sh 5 20
          bash ./evidence/localhost_cluster.sh 10 20
          bash ./evidence/localhost_cluster.sh 25 20

      - name: Archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-results
          path: |
            results/evidence/
            results/localhost_cluster_*/
          retention-days: 30

      - name: Show aggregated table
        run: cat results/evidence/evidence_table.md 2>/dev/null | head -40 || echo "(aggregation skipped)"

  emulation:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain (explicit stable for emulation)
        uses: dtolnay/rust-toolchain@stable

      - name: Network emulation (tc netem, 4-node cluster, 6 scenarios)
        run: |
          # sudo drops the rustup PATH and rustup needs an explicit default;
          # re-export cargo's bin dir and set RUSTUP_TOOLCHAIN so the build works
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export RUSTUP_TOOLCHAIN=stable
          sudo env "PATH=$PATH" "RUSTUP_TOOLCHAIN=stable" bash ./evidence/emulate_network.sh 4 30

      - name: Archive emulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: emulation-results
          path: results/emulated_4/
          retention-days: 30
